# 生产环境配置
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/unidatax_dev?useUnicode=true&characterEncoding=utf8&zeroDateTimeBehavior=convertToNull&useSSL=true&serverTimezone=GMT%2B8&allowPublicKeyRetrieval=true
    username: ${DB_USERNAME:admin}
    password: ${DB_PASSWORD:hekaig24}
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      
# 服务器配置
server:
  port: ${SERVER_PORT:18081}
  servlet:
    context-path: /
  compression:
    enabled: true
    min-response-size: 1024
    mime-types: text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
    
# 生产环境日志配置
logging:
  config: classpath:logback-spring.xml
  level:
    root: INFO
    com.queryu: INFO
    org.springframework.security: WARN
    org.springframework.web: INFO
    
# 生产环境跨域配置
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:18081}
  allowed-methods: GET,POST,PUT,DELETE,OPTIONS
  allowed-headers: "*"
  allow-credentials: true

# 自定义配置
app:
  # JWT配置
  jwt:
    secret: ${JWT_SECRET:queryuTrinoFrontendSecretKey2024ForHS512AlgorithmMustBeLongerThan512BitsAtLeast64Characters}
    expiration: ${JWT_EXPIRATION:86400000} # 24小时
  
  # 安全配置
  security:
    password-strength: ${PASSWORD_STRENGTH:HIGH}
    max-login-attempts: ${MAX_LOGIN_ATTEMPTS:5}
    lockout-duration: ${LOCKOUT_DURATION:900000} # 15分钟
    
  # 外部API配置
  external-apis:
    gravitino:
      base-url: ${GRAVITINO_API_URL:http://10.177.64.21:16001}
      timeout: ${GRAVITINO_TIMEOUT:30000}
    trino:
      base-url: ${TRINO_API_URL:https://trino-http.test.unicom.local:16000}
      username: ${TRINO_USERNAME:admin}
      password: ${TRINO_PASSWORD:rs{=uzW$UZ4v{BR!}
      timeout: ${TRINO_TIMEOUT:60000}

# Actuator监控配置
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    export:
      prometheus:
        enabled: true